<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 474" role="img" aria-labelledby="title desc"><title id="title">A complete guillotine construction reaching the area bound</title><desc id="desc">Finished pieces form forty columns and ten rows. Each horizontal cut is made across its current strip. A reconstruction of the saved witness, not a search history.</desc><rect width="720" height="474" fill="#fafaf7"/><g font-family="Arial,sans-serif"><text x="24" y="36" font-size="26" fill="#202723" font-weight="bold">The complete 40 × 40 cutting pattern</text><rect x="24" y="62" width="320" height="320" fill="#dcece6" stroke="#1d7660" stroke-width="2"/><path d="M32 62v320" stroke="#769d8f" stroke-width="0.7"/><path d="M40 62v320" stroke="#769d8f" stroke-width="0.7"/><path d="M48 62v320" stroke="#769d8f" stroke-width="0.7"/><path d="M56 62v320" stroke="#769d8f" stroke-width="0.7"/><path d="M64 62v320" stroke="#769d8f" stroke-width="0.7"/><path d="M72 62v320" stroke="#769d8f" stroke-width="0.7"/><path d="M80 62v320" stroke="#769d8f" stroke-width="0.7"/><path d="M88 62v320" stroke="#769d8f" stroke-width="0.7"/><path d="M96 62v320" stroke="#769d8f" stroke-width="0.7"/><path d="M104 62v320" stroke="#769d8f" stroke-width="0.7"/><path d="M112 62v320" stroke="#769d8f" stroke-width="0.7"/><path d="M120 62v320" stroke="#769d8f" stroke-width="0.7"/><path d="M128 62v320" stroke="#769d8f" stroke-width="0.7"/><path d="M136 62v320" stroke="#769d8f" stroke-width="0.7"/><path d="M144 62v320" stroke="#769d8f" stroke-width="0.7"/><path d="M152 62v320" stroke="#769d8f" stroke-width="0.7"/><path d="M160 62v320" stroke="#769d8f" stroke-width="0.7"/><path d="M168 62v320" stroke="#769d8f" stroke-width="0.7"/><path d="M176 62v320" stroke="#769d8f" stroke-width="0.7"/><path d="M184 62v320" stroke="#769d8f" stroke-width="0.7"/><path d="M192 62v320" stroke="#769d8f" stroke-width="0.7"/><path d="M200 62v320" stroke="#769d8f" stroke-width="0.7"/><path d="M208 62v320" stroke="#769d8f" stroke-width
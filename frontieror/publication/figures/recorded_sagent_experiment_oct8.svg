<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1040" width="760" height="1040" role="img" aria-labelledby="title desc"><title id="title">A recorded scheduling iteration</title><desc id="desc">October 8 development hypothesis, experiment, conclusion and follow-up, condensed from saved Trackinizer records.</desc><rect width="760" height="1040" fill="#fafaf7"/><g font-family="Arial,sans-serif" fill="#0b0d10"><text x="32" y="48" font-size="30" font-weight="700">A recorded scheduling iteration</text><rect x="24" y="80" width="712" height="198" rx="8" fill="#ffffff" stroke="#e7e6df" stroke-width="2"/><text x="48" y="122" font-size="30" font-weight="700" fill="#1d8a73">01 · Hypothesis</text><text x="48" y="162" font-size="28">Update the changed machine links.</text><text x="48" y="196" font-size="28">Reuse timing calculations; diversify restarts.</text><text x="48" y="230" font-size="28">Several implementation changes together.</text><path d="M380 283v14m-6-6 6 6 6-6" fill="none" stroke="#1d8a73" stroke-width="3"/><rect x="24" y="302" width="712" height="198" rx="8" fill="#ffffff" stroke="#e7e6df" stroke-width="2"/><text x="48" y="344" font-size="30" font-weight="700" fill="#1d8a73">02 · Experiment</text><text x="48" y="384" font-size="28">300 seconds · one worker · seed 0</text><text x="48" y="418" font-size="28">All five development cases improved.</text><text x="48" y="452" font-size="28">Case 1: 31,807 → 30,579.</text><text x="48" y="486" font-size="28">Case 4 still above its reference.</text><path d="M380 505v14m-6-6 6 6 6-6" fill="none" stroke="#1d8a73" stroke-width="3"/><rect x="24" y="524" width="712" height="198" rx="8" fill="#ffffff" stroke="#e7e6df" stroke-width="2"/><text x="48" y="566" font-size="30" font-weight="700" fill="#1d8a73">03 · Conclusion</text><text x="48" y="606" font-size="28">Combined revision improved on version 1.</text><text x="48" y="640" font-size="28">Individual effects were not isolated.</text><text x="48" y="674" font-size="28">Repeat with seed 1 before longer runs.</text><path d="M380 727v14m-6-6 6 6 6-6" fill="none" stroke="#1d8a73" stroke-width="3"/><rect x="24" y="746" width="712" height="198" rx="8" fill="#ffffff" stroke="#e7e6df" stroke-width="2"/><text x="48" y="788" font-size="30" font-weight="700" fill="#1d8a73">04 · Follow-up</text><text x="48" y="828" font-size="28">Seed 1: five paired improvements again.</text><text x="48" y="862" font-size="28">Next: a uniform 1,200-second budget</text><text x="48" y="896" font-size="28">and a separate CP-SAT LNS comparator.</text><text x="32" y="1014" font-size="26" fill="#566573">Saved records, condensed. Not a reasoning transcript.</text></g></svg>
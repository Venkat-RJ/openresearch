<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 434" role="img" aria-labelledby="title desc"><title id="title">Delivery witness and cost breakdown</title><desc id="desc">Pickup 5, pickup 4, delivery 4, delivery 5. Stack is shown from bottom to top. Same saved values as the animation.</desc><rect width="720" height="434" fill="#fafaf7"/><g font-family="Arial,sans-serif"><text x="24" y="36" font-size="26" fill="#202723" font-weight="bold">One saved loading sequence</text><text x="24" y="65" font-size="18" fill="#202723" font-weight="normal">Vehicle 5 also serves requests 28 and 30 earlier in its route.</text><rect x="24" y="85" width="150" height="112" rx="6" fill="#fff" stroke="#d9ded5"/><text x="38" y="116" font-size="24" fill="#1d7660" font-weight="bold">P5</text><text x="38" y="147" font-size="18" fill="#202723" font-weight="normal">Load 1 / 22</text><text x="38" y="177" font-size="17" fill="#202723" font-weight="normal">Stack: 5</text><text x="178" y="148" font-size="23" fill="#202723" font-weight="normal">→</text><rect x="198" y="85" width="150" height="112" rx="6" fill="#fff" stroke="#d9ded5"/><text x="212" y="116" font-size="24" fill="#1d7660" font-weight="bold">P4</text><text x="212" y="147" font-size="18" fill="#202723" font-weight="normal">Load 8 / 22</text><text x="212" y="177" font-size="17" fill="#202723" font-weight="normal">Stack: 5, 4</text><text x="352" y="148" font-size="23" fill="#202723" font-weight="normal">→</text><rect x="372" y="85" width="150" height="112" rx="6" fill="#fff" stroke="#d9ded5"/><text x="386" y="116" font-size="24" fill="#1d7660" font-weight="bold">D4</text><text x="386" y="147" font-size="18" fill="#202723" font-weight="normal">Load 1 / 22</text><text x="386" y="177" font-size="17" fill="#202723" font-weight="normal">Stack: 5</text><text x="526" y="148" font-size="23" fill="#202723" font-weight="normal">→</text><rect x="546" y="85" width="150" height="112" rx="6" fill="#fff" stroke="#d9ded5"/><text x="560" y="116" font-size="24" fill="#1d7660" font-weight="bold">D5</text><text x="560" y="147" font-size="18" fill="#202723" font-weight="normal">Load 0 / 22</text><text x="560" y="177" font-size="17" fill="#202723" font-weight="normal">Stack: empty</text><text x="24" y="231" font-size="23" fill="#202723" font-weight="bold">Full plan: 30 requests, 10 operating trucks</text><text x="24" y="266" font-size="20" fill="#202723" font-weight="bold">Cost component</text><text x="344" y="266" font-size="20" fill="#202723" font-weight="bold">Reference</text><text x="524" y="266" font-size="20" fill="#202723" font-weight="bold">Candidate</text><text x="24" y="301" font-size="20" fill="#202723" font-weight="normal">Vehicle charges</text><text x="344" y="301" font-size="20" fill="#202723" font-weight="normal">300,000</text><text x="524" y="301" font-size="20" fill="#202723" font-weight="normal">100,000</text><text x="24" y="334" font-size="20" fill="#202723" font-weight="normal">Remaining arc cost</text><text x="344" y="334" font-size="20" fill="#202723" font-weight="normal">3,868</text><text x="524" y="334" font-size="20" fill="#202723" font-weight="normal">2,616.4</text><text x="24" y="367" font-size="20" fill="#202723" font-weight="normal">Total modeled cost</text><text x="344" y="367" font-size="20" fill="#202723" font-weight="normal">303,868</text><text x="524" y="367" font-size="20" fill="#202723" font-weight="normal">102,616.4</text><text x="24" y="409" font-size="18" fill="#202723" font-weight="normal">Avoided vehicle charges: 200,000 of the 201,251.6-unit saving.</text></g></svg>
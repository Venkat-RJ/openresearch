<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1040" width="760" height="1040" role="img" aria-labelledby="title desc"><title id="title">Research and the open-source feedback loop</title><desc id="desc">The focused scheduling study, separate broader campaigns, tooling observations, and issues or proposed pull requests feeding future work.</desc><rect width="760" height="1040" fill="#fafaf7"/><g font-family="Arial,sans-serif" fill="#0b0d10"><text x="32" y="48" font-size="30" font-weight="700">Research and the open-source feedback loop</text><rect x="24" y="80" width="712" height="198" rx="8" fill="#ffffff" stroke="#e7e6df" stroke-width="2"/><text x="48" y="122" font-size="30" font-weight="700" fill="#1d8a73">01 · Focused scheduling study</text><text x="48" y="162" font-size="28">Custom runner and linked research records.</text><text x="48" y="196" font-size="28">Frozen solver; 30 fresh problems.</text><text x="48" y="230" font-size="28">29 lower three-run means; 180 valid runs.</text><path d="M380 283v14m-6-6 6 6 6-6" fill="none" stroke="#1d8a73" stroke-width="3"/><rect x="24" y="302" width="712" height="198" rx="8" fill="#ffffff" stroke="#e7e6df" stroke-width="2"/><text x="48" y="344" font-size="30" font-weight="700" fill="#1d8a73">02 · Broader investigations</text><text x="48" y="384" font-size="28">An incomplete larger-instance campaign.</text><text x="48" y="418" font-size="28">Separate campaign: 180 distinct small tasks.</text><text x="48" y="452" font-size="28">177 feasible outputs; five reference gains.</text><path d="M380 505v14m-6-6 6 6 6-6" fill="none" stroke="#1d8a73" stroke-width="3"/><rect x="24" y="524" width="712" height="198" rx="8" fill="#ffffff" stroke="#e7e6df" stroke-width="2"/><text x="48" y="566" font-size="30" font-weight="700" fill="#1d8a73">03 · Tooling observations</text><text x="48" y="606" font-size="28">Recording gaps, timeouts and child processes.</text><text x="48" y="640" font-size="28">Paper coverage, worker messages, pending work.</text><text x="48" y="674" font-size="28">These observations informed contributions.</text><path d="M380 727v14m-6-6 6 6 6-6" fill="none" stroke="#1d8a73" stroke-width="3"/><rect x="24" y="746" width="712" height="198" rx="8" fill="#ffffff" stroke="#e7e6df" stroke-width="2"/><text x="48" y="788" font-size="30" font-weight="700" fill="#1d8a73">04 · Issues and proposed changes</text><text x="48" y="828" font-size="28">Sagent: #602, #601, #633 and #636.</text><text x="48" y="862" font-size="28">WeSearch: issue #271 and PR #275.</text><text x="48" y="896" font-size="28">Feedback informs the next investigation.</text><text x="32" y="1014" font-size="26" fill="#566573">Issues and proposals, not confirmed merged fixes.</text></g></svg>